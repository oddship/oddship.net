name: Deploy via s3site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oddship-s3site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: |
          python3 scripts/update_dependencies.py --check
          nix build .#default
          test "$(cat result/revision.txt)" = "$GITHUB_SHA"

      - name: Create site archive
        run: tar czf oddship.net.tar.gz -C result .

      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-ci
          ping: rhnvrm-private

      - name: Upload archive to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3SITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3SITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          AWS_EC2_METADATA_DISABLED: true
          S3SITE_BUCKET: static-sites
          S3SITE_ENDPOINT: http://rhnvrm-private:3900
        run: |
          set -euo pipefail
          nix shell --inputs-from . nixpkgs#awscli2 -c aws \
            --endpoint-url "${S3SITE_ENDPOINT}" \
            s3api put-object \
            --bucket "${S3SITE_BUCKET}" \
            --key "sites/oddship.net.tar.gz" \
            --body oddship.net.tar.gz >/dev/null
          nix shell --inputs-from . nixpkgs#awscli2 -c aws \
            --endpoint-url "${S3SITE_ENDPOINT}" \
            s3api head-object \
            --bucket "${S3SITE_BUCKET}" \
            --key "sites/oddship.net.tar.gz" >/dev/null

      - name: Verify public deployment
        run: python3 scripts/verify_deployment.py --url https://oddship.net --revision "$GITHUB_SHA" --timeout 600
