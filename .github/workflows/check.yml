name: Check Zola site
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check theme pins
        run: python3 scripts/update_dependencies.py --check
      - name: Build and check site
        run: nix build .#default
      - uses: actions/upload-artifact@v7
        with:
          name: oddship-preview
          path: result/
