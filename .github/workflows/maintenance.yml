name: Weekly maintenance

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Check links and report catalogue drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_catalogue.py --report maintenance.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalogue-maintenance
          path: maintenance.json

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Refresh Nix and theme pins
        run: python3 scripts/update_dependencies.py
      - name: Validate dependency update
        run: |
          git add flake.nix flake.lock themes/doordarshan
          nix build .#default
      - name: Open or update maintenance PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/dependencies
          delete-branch: true
          commit-message: 'chore(deps): refresh Nix and theme pins'
          title: 'chore(deps): refresh Nix and theme pins'
          body: |
            Refresh the locked Nix inputs and update the Doordarshan submodule and flake input together.

            Validation: the production Nix build, generated site checks, and Python tests passed. Review the preview artifact and mobile layout before merging.
          add-paths: |
            flake.nix
            flake.lock
            themes/doordarshan
      # GITHUB_TOKEN PRs do not trigger pull_request workflows. Dispatch the
      # check explicitly so the PR's head receives the required build status.
      - name: Run PR checks
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref automation/dependencies
